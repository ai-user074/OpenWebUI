version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_GPU_LAYER=35 # Adjust for CPU - keeps some layers on GPU if available, set lower for CPU
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "
        echo 'Starting Ollama...' &&
        ollama serve &
        OLLAMA_PID=$!
        sleep 5 &&
        echo 'Pulling phi3:3.8b model (this may take a while)...' &&
        ollama pull phi3:3.8b ||
        ollama pull llama2:3.8b ||
        ollama pull mistral:3.8b ||
        echo 'Model pull completed or failed - proceeding anyway' &&
        wait $OLLAMA_PID
      "

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:dev
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
      - ./:/app
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=dev-secret-key-change-in-production
      - ENV=dev
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  ollama:
  open-webui:
